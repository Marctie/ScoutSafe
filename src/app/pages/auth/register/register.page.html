<ion-content class="ion-padding" style="--background: #faf7ed;">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 0;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:48px;margin-bottom:8px;">⛺</div>
      <h1 style="font-size:28px;font-weight:700;color:#386641;margin:0;">ScoutSafe</h1>
      <p style="color:#6c757d;margin:4px 0 0;">Crea il tuo account</p>
    </div>

    <ion-card style="width:100%;max-width:400px;border-radius:16px;">
      <ion-card-header>
        <ion-card-title style="color:#386641;">Registrati</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="register()">
          <ion-item lines="full">
            <ion-label position="floating">Email</ion-label>
            <ion-input type="email" formControlName="email"></ion-input>
          </ion-item>
          <ion-item lines="full" style="margin-top:8px;">
            <ion-label position="floating">Password</ion-label>
            <ion-input type="password" formControlName="password"></ion-input>
          </ion-item>
          <ion-item lines="full" style="margin-top:8px;">
            <ion-label position="floating">Conferma Password</ion-label>
            <ion-input type="password" formControlName="confirm"></ion-input>
          </ion-item>
          <div *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.touched" style="color:#eb445a;font-size:12px;padding:4px 16px;">
            Le password non coincidono
          </div>
          <ion-button expand="block" type="submit" [disabled]="form.invalid" style="margin-top:24px;--background:#386641;">
            Crea Account
          </ion-button>
        </form>
        <div style="text-align:center;margin-top:16px;">
          <ion-text color="medium">Hai già un account? </ion-text>
          <a routerLink="/auth/login" style="color:#386641;font-weight:600;">Accedi</a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
