<ion-content class="ion-padding" style="--background: #faf7ed;">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 0;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:48px;margin-bottom:8px;">⛺</div>
      <h1 style="font-size:28px;font-weight:700;color:#386641;margin:0;">ScoutSafe</h1>
      <p style="color:#6c757d;margin:4px 0 0;">La sicurezza del tuo campo scout</p>
    </div>

    <ion-card style="width:100%;max-width:400px;border-radius:16px;">
      <ion-card-header>
        <ion-card-title style="color:#386641;">Accedi</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="login()">
          <ion-item lines="full">
            <ion-label position="floating">Email</ion-label>
            <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
          </ion-item>
          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" style="color:#eb445a;font-size:12px;padding:4px 16px;">
            Inserisci un indirizzo email valido
          </div>

          <ion-item lines="full" style="margin-top:8px;">
            <ion-label position="floating">Password</ion-label>
            <ion-input type="password" formControlName="password" autocomplete="current-password"></ion-input>
          </ion-item>
          <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" style="color:#eb445a;font-size:12px;padding:4px 16px;">
            La password deve avere almeno 6 caratteri
          </div>

          <ion-button expand="block" type="submit" [disabled]="form.invalid" style="margin-top:24px;--background:#386641;">
            Accedi
          </ion-button>
        </form>

        <div style="text-align:center;margin-top:16px;">
          <ion-text color="medium">Non hai un account? </ion-text>
          <a routerLink="/auth/register" style="color:#386641;font-weight:600;">Registrati</a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
